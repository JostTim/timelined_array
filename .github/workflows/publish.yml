
name: Publish Release
on: 
    push:
        tags:
          - "v**"
          # Run on push of tags starting with v***

    workflow_run:
        workflows: ["Run Tests"]
        branches: [main]
        types: 
          - completed

jobs:
    build:
        name: Build Distribution
        runs-on: ubuntu-latest
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')

        steps:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

          - name: Install uv
            uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

          - name: Build Distribution
            run: uv build

          - name : Upload Files For Next Job
            uses: actions/upload-artifact@v7
            with:
              name: release-files
              path: |
                dist/**
                !dist/.gitignore
              retention-days: 1
              if-no-files-found: error

    release-on-github:
        name: Release on Github
        needs: build
        runs-on: ubuntu-latest
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')

        permissions:
            # Needed to create the release and upload assets
            contents: write

        steps : 
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

          - name: Get Artifacts From Last Job
            uses: actions/download-artifact@v7
            with:
              name: release-files
              path: dist

          - name: Get Asset name
            run: |
              export PKG=$(ls dist/)
              set -- $PKG
              echo "name=$1" >> $GITHUB_ENV

          - name: Extract changelog section for this release
            run: |
              VERSION="${GITHUB_REF_NAME#v}"
              echo "version=$VERSION" >> $GITHUB_ENV
              {
                echo "## Install"
                echo ""
                echo "with pip"
                echo '```bash'
                echo "pip install timelined-array==$VERSION"
                echo '```'
                echo ""
                echo "or with uv :"
                echo '```bash'
                echo "uv add timelined-array==$VERSION"
                echo '```'
                echo ""
                echo "📦 [View on PyPI](https://pypi.org/project/timelined-array/$VERSION/)"
              } > release_notes.md
              awk -v ver="[$VERSION]" '
                index($0, "## " ver) == 1 {flag=1; next}
                /^## \[/ {flag=0}
                flag
              ' CHANGELOG.md >> release_notes.md

          - name: Upload Release Asset (sdist) to GitHub
            uses: softprops/action-gh-release@v3
            with:
              files: |
                dist/**
              body_path: release_notes.md
              generate_release_notes: true

    pypi-publish:
        name: Upload Release to PyPI
        needs: release-on-github
        runs-on: ubuntu-latest
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')

        permissions:
            # This permission is needed for private repositories.
            contents: read
            # IMPORTANT: this permission is mandatory for trusted publishing
            id-token: write

        steps:
          - name: Install uv
            uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

          - name: Get Artifacts From Previous Job
            uses: actions/download-artifact@v7
            with:
              name: release-files
              path: dist

          - name: Publish Package Distributions to PyPI
            if: ${{ !env.ACT }}
            run: uv publish

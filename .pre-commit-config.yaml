repos:
  - repo: local
    hooks:
      - id: bump-and-stage-version
        name: Bump and stage version files
        entry: powershell -Command "uv tool run bump-my-version bump patch; git add src/timelined_array/__init__.py pyproject.toml"
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

      - id: tag-version
        name: Tag HEAD with committed version
        entry: powershell -Command "if ((git log -1 --pretty=%B) -match '\[release\]' -and -not (git tag -l ('v' + (uv tool run bump-my-version show current_version)))) { git tag ('v' + (uv tool run bump-my-version show current_version)) }"
        language: system
        always_run: true
        pass_filenames: false
        stages: [post-commit]